apply plugin: 'com.android.library'

// can be: "V8", "JSC", "HERMES", "QUICKJS", "QUICKJS_NG", "PRIMJS".
// QUICKJS is an alias for QUICKJS_NG; the bellard tree was dropped.
// "SHERMES" is accepted as a compatibility alias for the Static Hermes build.

def jsEngine = "V8"
def hasEngine = project.hasProperty("engine")
if (hasEngine) {
    jsEngine = engine
}
def runtimeVersionFile = new File(projectDir, "../../../../NativeScript/runtime/android/version/Version.h")

def hasHostObjects = true //project.hasProperty("useHostObjects")
def isNapiModule = project.hasProperty("asNapiModule");

printf("Compiling NativeScript with %s.\n", jsEngine)

def optimized = project.hasProperty("optimized")
if (optimized) {
    println "Optimized build triggered."
}

def optimizedWithInspector = project.hasProperty("optimizedWithInspector")
if (optimizedWithInspector) {
    println "Optimized build with inspector triggered."
}

def onlyX86 = project.hasProperty("onlyX86")
if (onlyX86) {
    println "OnlyX86 build triggered."
}

def useCCache = project.hasProperty("useCCache")
if (useCCache) {
    println "Use CCache build triggered."
}

// Bytecode stack-trace support. Defaults on (opt out with -PnsBytecodeDisabled).
// Defines NS_BYTECODE_ENABLED so BuildStacktraceFrames accepts bytecode frames
// (app-relative source names) and rebuilds their full runtime URL. Harmless when
// the app ships plain JS — those frames always carry a "file://" URL already.
def bytecodeStacktraces = !project.hasProperty("nsBytecodeDisabled")
if (bytecodeStacktraces) {
    println "Bytecode stack-trace frame support enabled."
}

// V8 14.9's internal headers (src/base/atomicops.h, src/base/memcopy.h) use
// std::atomic_ref unconditionally. libc++ only ships it from LLVM 19, which
// means NDK r29 -- r27 and r28 both fail to compile the inspector sources.
// Upstream V8 never hits this because Chromium builds Android with its own
// clang rather than the NDK's.
def defaultNdkVersion = "29.0.14206865"

def hasNdkVersion = project.hasProperty("ndkVersion")
if (hasNdkVersion) {
    println "Runtime using NDK version " + ndkVersion
}

def NDK_PATH = ""
def hasNdkDirectory = project.hasProperty("ndkDirectory")
if (!hasNdkDirectory) {
    println "No ndkDirectory set, checking environment \$ANDROID_NDK..."

    NDK_PATH = "$System.env.ANDROID_NDK"
    if (NDK_PATH == null || NDK_PATH == "null") {
        println "No ndkDirectory set, checking environment \$ANDROID_NDK_ROOT..."
        NDK_PATH = "$System.env.ANDROID_NDK_ROOT"
    }

    if (NDK_PATH == null || NDK_PATH == "null") {
        println "No ndkDirectory set, checking environment \$ANDROID_NDK_HOME..."
        NDK_PATH = "$System.env.ANDROID_NDK_HOME"
    }
} else {
    NDK_PATH = ndkDirectory
}

// if a ndkVersion is passed ensure we use it in NDK_PATH
if (hasNdkVersion) {
    NDK_PATH = "$System.env.ANDROID_HOME/ndk/${ndkVersion}"
} else if (NDK_PATH == null || NDK_PATH == "null" || NDK_PATH == "") {
   if (!hasNdkVersion) {
        NDK_PATH = "$System.env.ANDROID_HOME/ndk/${defaultNdkVersion}"
   } else {
       NDK_PATH = "$System.env.ANDROID_HOME/ndk/${ndkVersion}"
   }
}

// V8 14.9's internal headers use std::atomic_ref, which libc++ only ships from
// LLVM 19 (NDK r29). r27/r28 fail deep inside src/base/atomicops.h with a wall
// of template errors that says nothing about the real cause, and $ANDROID_NDK
// in the environment silently outranks defaultNdkVersion -- so check here and
// either pick a usable NDK or say plainly what is wrong.
if (jsEngine.contains("V8")) {
    def MIN_NDK_MAJOR_FOR_V8 = 29
    def resolvedMajor = (NDK_PATH =~ /ndk\/(\d+)\./) ? ((NDK_PATH =~ /ndk\/(\d+)\./)[0][1] as int) : -1

    if (resolvedMajor in 0..<MIN_NDK_MAJOR_FOR_V8) {
        def ndkRoot = new File("$System.env.ANDROID_HOME/ndk")
        def candidate = (ndkRoot.listFiles({ File f -> f.isDirectory() } as FileFilter) ?: [])
                .findAll { (it.name =~ /^(\d+)\./) && ((it.name =~ /^(\d+)\./)[0][1] as int) >= MIN_NDK_MAJOR_FOR_V8 }
                .min { it.name }

        if (candidate != null) {
            println "WARNING: NDK ${resolvedMajor} cannot build V8 14.9 (needs std::atomic_ref, " +
                    "NDK r${MIN_NDK_MAJOR_FOR_V8}+). Using ${candidate.name} instead."
            NDK_PATH = candidate.absolutePath
        } else {
            throw new GradleException(
                "V8 requires NDK r${MIN_NDK_MAJOR_FOR_V8} or newer (std::atomic_ref in V8 14.9's " +
                "headers); resolved NDK is r${resolvedMajor} at ${NDK_PATH}. Install r${MIN_NDK_MAJOR_FOR_V8}+ " +
                "and pass -PndkVersion=<version>, or point \$ANDROID_NDK at it.")
        }
    }
}

println "Runtime using NDK_PATH: " + NDK_PATH

base {
    if (!optimized && !optimizedWithInspector) {
        archivesName = "${base.archivesName.get()}-regular"
    } else {
        if (optimized) {
            archivesName = "${base.archivesName.get()}-optimized"
        } else if (optimizedWithInspector) {
            archivesName = "${base.archivesName.get()}-optimized-with-inspector"
        }
    }
}

android {
    namespace "com.tns.android_runtime"

    compileSdk NS_DEFAULT_COMPILE_SDK_VERSION as int
    buildToolsVersion = NS_DEFAULT_BUILD_TOOLS_VERSION as String

    sourceSets {
        main {
            def defaultSrcPath = "src/main/java"
            def bindingGeneratorSourcePath = new File(project(":runtime-binding-generator").projectDir, defaultSrcPath)

            // embed runtime binding generator in runtime, while keeping it in a separate project
            java.srcDirs = [bindingGeneratorSourcePath, defaultSrcPath]
        }
    }

    ndkVersion = project.findProperty("ndkVersion") ?: defaultNdkVersion

    defaultConfig {
        minSdkVersion NS_DEFAULT_MIN_SDK_VERSION as int
        targetSdkVersion NS_DEFAULT_COMPILE_SDK_VERSION as int

        externalNativeBuild {
            cmake {

                if (optimized) {
                    arguments.add("-DOPTIMIZED_BUILD=true")
                }

               if (optimizedWithInspector) {
                   arguments.add("-DOPTIMIZED_WITH_INSPECTOR_BUILD=true")
               }

               if (useCCache) {
                   arguments.add("-DUSE_CCACHE=true")
               }

               if (hasHostObjects) {
                   arguments.add("-DUSE_HOST_OBJECTS=true")
               }

                if (isNapiModule) {
                    arguments.add("-DIS_NAPI_MODULE=true")
                }

                if (bytecodeStacktraces) {
                    arguments.add("-DNS_BYTECODE=1")
                }

               if (jsEngine == "QUICKJS" || jsEngine == "QUICKJS_NG") {
                    arguments.add("-DQUICKJS=1")
                    // There is only one quickjs engine now: the NativeScript-patched
                    // quickjs-ng vendored at vendor/quickjs/source_ng, which is the
                    // same tree the Apple build uses. The bellard tree was dropped
                    // (it never carried the NativeScript patches), so QUICKJS is
                    // kept purely as an alias for QUICKJS_NG.
                    arguments.add("-DQUICKJS_NG=1")
                    // SHERMES is kept as an alias for the static-hermes (hermesvm)
                    // engine, which is now the canonical HERMES engine.
                } else if (jsEngine == "HERMES" || jsEngine == "SHERMES") {
                    arguments.add("-DHERMES=1")
                } else if (jsEngine == "PRIMJS") {
                    arguments.add("-DPRIMJS=1")
                }else if (jsEngine == "JSC") {
                    arguments.add("-DJSC=1")
                } else if (jsEngine.contains("V8")) {
                    arguments.add("-DV8=1")
                }

//              arguments "-DANDROID_TOOLCHAIN=clang", "-DANDROID_STL=c++_static", "-DANDROID_NDK_ROOT=${NDK_PATH}"

                if (jsEngine == "V8-13") {
                    cppFlags "-std=c++20"
                } else {
                    cppFlags "-std=c++17"
                }
                arguments "-DANDROID_STL=c++_shared",
                        "-DANDROID_NDK_ROOT=${NDK_PATH}",
                        "-DCMAKE_ANDROID_NDK=${NDK_PATH}",
                        "-DCMAKE_TOOLCHAIN_FILE=${NDK_PATH}/build/cmake/android.toolchain.cmake",
                        "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }

        ndk {
            minSdkVersion NS_DEFAULT_MIN_SDK_VERSION as int
            if (onlyX86) {
                // The updated JSC only ships 64-bit libraries, so fall back to
                // x86_64 when a single-ABI (emulator) build is requested.
                abiFilters jsEngine == "JSC" ? 'x86_64' : 'x86'
            } else if (jsEngine == "JSC") {
                // The newer JSC engine only provides arm64-v8a and x86_64
                // prebuilts, so restrict the runtime to those two ABIs.
                abiFilters 'x86_64', 'arm64-v8a'
            } else {
                abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
            }
        }

        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            // version "3.18.1"
            path "CMakeLists.txt"
        }
    }

    buildFeatures {
        prefab true
    }

    if (jsEngine.contains("V8")) {
        packagingOptions {
            exclude "**/libjsc.so"
            exclude "**/libhermes.so"
            exclude "**/libhermesvm.so"
            exclude "**/libjsi.so"
        }
    } else if (jsEngine == "HERMES") {
        packagingOptions {
            exclude "**/libjsc.so"
            exclude "**/libhermes.so"
            pickFirst "**/libc++_shared.so"
        }
    } else if (jsEngine == "JSC") {
        packagingOptions {
            exclude "**/libv8android.so"
            exclude "**/libhermes.so"
            exclude "**/libhermesvm.so"
            exclude "**/libjsi.so"
        }
    } else if (jsEngine == "QUICKJS" || jsEngine == "PRIMJS" || jsEngine == "QUICKJS_NG") {
        packagingOptions {
            exclude "**/libhermes.so"
            exclude "**/libhermesvm.so"
            exclude "**/libjsc.so"
            exclude "**/libjsi.so"
        }
    }
}

